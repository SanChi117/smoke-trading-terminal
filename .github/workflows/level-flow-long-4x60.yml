name: level-flow-long-4x60

on:
  pull_request:
    branches: [main]
    paths:
      - "app/lib/level/**"
      - "scripts/run_level_flow_logic_audit.mjs"
      - "scripts/run_historical_long_audit.mjs"
      - "scripts/compare_historical_long_exit_modes.mjs"
      - ".github/workflows/level-flow-long-4x60.yml"
  workflow_dispatch:

concurrency:
  group: level-flow-long-4x60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-long:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Install
        run: npm ci
      - name: Strategy invariant tests
        run: node --experimental-strip-types --test tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Logic lint
        run: npx eslint app/lib/level scripts/run_historical_long_audit.mjs scripts/compare_historical_long_exit_modes.mjs
      - name: Historical LONG audit
        env:
          AUDIT_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          AUDIT_DAYS: 60
          AUDIT_END_ISO: 2025-09-30T23:55:00.000Z
        run: node --experimental-strip-types scripts/run_historical_long_audit.mjs
      - name: Compare LONG exit modes
        run: node --experimental-strip-types scripts/compare_historical_long_exit_modes.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-level-flow-long-4x60
          path: runtime/level-flow-logic-audit/
          if-no-files-found: error
          retention-days: 30
