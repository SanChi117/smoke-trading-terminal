name: low-volatility-prospective-r1

on:
  pull_request:
    branches: [research/low-volatility-r1]
    paths:
      - 'docs/LOW_VOLATILITY_PROSPECTIVE_R1.md'
      - 'scripts/run_low_volatility_prospective_symbol_r1.mjs'
      - 'scripts/aggregate_low_volatility_prospective_r1.mjs'
      - '.github/workflows/low-volatility-prospective-r1.yml'
      - 'research/prospective-low-vol-snapshot-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sha256sum docs/LOW_VOLATILITY_PROSPECTIVE_R1.md
      - run: |
          node --check scripts/run_low_volatility_prospective_symbol_r1.mjs
          node --check scripts/aggregate_low_volatility_prospective_r1.mjs

  symbol:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,ADAUSDT,SOLUSDT,DOGEUSDT,LINKUSDT,AVAXUSDT,DOTUSDT,LTCUSDT,ATOMUSDT,AAVEUSDT,NEARUSDT,INJUSDT,OPUSDT,ARBUSDT,APTUSDT,SUIUSDT,SEIUSDT,TAOUSDT,ONDOUSDT,TONUSDT,FETUSDT,WIFUSDT,BCHUSDT,TRXUSDT,XLMUSDT,ETCUSDT,FILUSDT,UNIUSDT,ICPUSDT,ALGOUSDT,VETUSDT,RUNEUSDT,GALAUSDT,SANDUSDT,MANAUSDT,CRVUSDT,CHZUSDT,LDOUSDT,DYDXUSDT,IMXUSDT,STXUSDT,COMPUSDT,SNXUSDT,ZECUSDT,KAVAUSDT,XTZUSDT,ENJUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo apt-get update -qq && sudo apt-get install -y unzip
      - env:
          LV_SYMBOL: ${{ matrix.symbol }}
          LV_OUTPUT_DIR: runtime/low-volatility-prospective-r1
        run: node scripts/run_low_volatility_prospective_symbol_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lvpros-${{ matrix.symbol }}
          path: runtime/low-volatility-prospective-r1/${{ matrix.symbol }}.json
          retention-days: 14

  aggregate:
    needs: symbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lvpros-*
          path: runtime/low-volatility-prospective-r1-input
          merge-multiple: true
      - env:
          LV_INPUT_DIR: runtime/low-volatility-prospective-r1-input
          LV_SUMMARY_DIR: runtime/low-volatility-prospective-r1-summary
        run: node scripts/aggregate_low_volatility_prospective_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: low-volatility-prospective-r1-summary
          path: runtime/low-volatility-prospective-r1-summary/**
          retention-days: 90
