name: public-audit-smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-audit-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Wait for public site sync and record audit result
        shell: bash
        run: |
          set -u
          url="https://smoke-terminal.kriptabuchcko117.chatgpt.site/audit"
          result="FAILED"
          status="000"
          for attempt in $(seq 1 20); do
            status=$(curl --location --silent --show-error --max-time 30 --output /tmp/audit.html --write-out "%{http_code}" "$url" || true)
            echo "attempt=$attempt status=$status bytes=$(wc -c </tmp/audit.html 2>/dev/null || echo 0)"
            if [[ "$status" == "200" ]] \
              && grep -q "Golden Case Audit" /tmp/audit.html \
              && grep -q "Как стратегия видит сделку от уровня" /tmp/audit.html; then
              result="OK"
              break
            fi
            sleep 30
          done

          mkdir -p runtime
          {
            echo "status=$result"
            echo "http_status=$status"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "url=$url"
          } > runtime/public-audit-smoke.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime/public-audit-smoke.txt
          git commit -m "Record public audit smoke: $result"
          git push origin HEAD:main

          if [[ "$result" != "OK" ]]; then
            echo "Public /audit did not expose the merged page in time."
            head -c 1200 /tmp/audit.html 2>/dev/null || true
            exit 1
          fi
          echo "PUBLIC_AUDIT_OK"
