name: portable-paper-postgres-qa

on:
  push:
    paths:
      - 'core/paper/postgres-paper-store.ts'
      - 'core/paper/portable-paper-runtime.ts'
      - 'deployment/postgres/**'
      - 'tests/postgres-paper-store.integration.mjs'
      - '.github/workflows/portable-paper-postgres-qa.yml'
  pull_request:
    paths:
      - 'core/paper/postgres-paper-store.ts'
      - 'core/paper/portable-paper-runtime.ts'
      - 'deployment/postgres/**'
      - 'tests/postgres-paper-store.integration.mjs'
      - '.github/workflows/portable-paper-postgres-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-paper-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smoke_test
          POSTGRES_PASSWORD: smoke_ci_only
          POSTGRES_DB: smoke_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke_test -d smoke_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SMOKE_TEST_PG_URL: postgresql://smoke_test:smoke_ci_only@127.0.0.1:5432/smoke_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Install CI-only PostgreSQL client, without changing lockfile
        run: npm install --no-save --package-lock=false pg@8.16.3
      - name: Typecheck portable PAPER core and PostgreSQL adapter
        run: npx tsc --noEmit --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext --strict --allowImportingTsExtensions core/paper/portable-paper-runtime.ts core/paper/postgres-paper-store.ts
      - name: Run PostgreSQL-backed V5 PAPER persistence and CAS tests
        run: node --experimental-strip-types --test tests/postgres-paper-store.integration.mjs
