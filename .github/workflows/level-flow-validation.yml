name: level-flow-logic-audit

on:
  pull_request:
    branches: [main]
    paths:
      - "app/lib/level/**"
      - "app/lib/binance-level-client.ts"
      - "scripts/run_level_flow_logic_audit.mjs"
      - "scripts/run_level_flow_logic_audit_window.mjs"
      - "tests/mtf-level-strategy.test.mjs"
      - ".github/workflows/level-flow-validation.yml"
  workflow_dispatch:

concurrency:
  group: level-flow-logic-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - run: npm ci
      - name: Strategy invariant tests
        run: node --experimental-strip-types --test tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Logic lint
        run: npx eslint app/lib/level scripts/run_level_flow_logic_audit.mjs scripts/run_level_flow_logic_audit_window.mjs tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Production build
        run: npm run build
      - name: BTC ETH current 90-day logic audit
        env:
          AUDIT_SYMBOLS: BTCUSDT,ETHUSDT
          AUDIT_DAYS: "90"
        run: node --experimental-strip-types scripts/run_level_flow_logic_audit.mjs
      - name: BTC ETH historical long-coverage audit
        env:
          AUDIT_SYMBOLS: BTCUSDT,ETHUSDT
          AUDIT_DAYS: "60"
          AUDIT_END: "2025-09-30T23:55:00.000Z"
          AUDIT_LABEL: "2025-09"
        run: node --experimental-strip-types scripts/run_level_flow_logic_audit_window.mjs
      - name: Upload logic audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-level-flow-logic-audit
          path: runtime/level-flow-logic-audit*/
          if-no-files-found: warn
          retention-days: 30
