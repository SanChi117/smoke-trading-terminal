name: level-flow-validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/lib/level/**"
      - "app/lib/binance-level-client.ts"
      - "scripts/run_level_flow_wide_validation.mjs"
      - ".github/workflows/level-flow-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - run: npm ci
      - name: Strategy unit tests
        run: node --experimental-strip-types --test tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Run fixed-universe 365-day validation
        run: node --experimental-strip-types scripts/run_level_flow_wide_validation.mjs
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-level-flow-wide-validation
          path: runtime/level-flow-validation/
          if-no-files-found: warn
          retention-days: 30
