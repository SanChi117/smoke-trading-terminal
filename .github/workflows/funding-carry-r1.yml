name: funding-carry-r1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/FUNDING_CARRY_R1.md'
      - 'scripts/run_funding_carry_symbol_r1.mjs'
      - 'scripts/aggregate_funding_carry_r1.mjs'
      - '.github/workflows/funding-carry-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Freeze protocol blob
        run: sha256sum docs/FUNDING_CARRY_R1.md
      - name: Syntax check
        run: |
          node --check scripts/run_funding_carry_symbol_r1.mjs
          node --check scripts/aggregate_funding_carry_r1.mjs

  symbol:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol:
          - BTCUSDT
          - ETHUSDT
          - BNBUSDT
          - XRPUSDT
          - ADAUSDT
          - SOLUSDT
          - DOGEUSDT
          - LINKUSDT
          - AVAXUSDT
          - DOTUSDT
          - LTCUSDT
          - ATOMUSDT
          - AAVEUSDT
          - NEARUSDT
          - INJUSDT
          - OPUSDT
          - ARBUSDT
          - APTUSDT
          - SUIUSDT
          - SEIUSDT
          - TAOUSDT
          - ONDOUSDT
          - TONUSDT
          - FETUSDT
          - WIFUSDT
          - BCHUSDT
          - TRXUSDT
          - XLMUSDT
          - ETCUSDT
          - FILUSDT
          - UNIUSDT
          - ICPUSDT
          - ALGOUSDT
          - VETUSDT
          - RUNEUSDT
          - GALAUSDT
          - SANDUSDT
          - MANAUSDT
          - CRVUSDT
          - CHZUSDT
          - LDOUSDT
          - DYDXUSDT
          - IMXUSDT
          - STXUSDT
          - COMPUSDT
          - SNXUSDT
          - ZECUSDT
          - KAVAUSDT
          - XTZUSDT
          - ENJUSDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y unzip
      - name: Run funding carry symbol
        env:
          FC_SYMBOL: ${{ matrix.symbol }}
          FC_OUTPUT_DIR: runtime/funding-carry-r1
        run: node scripts/run_funding_carry_symbol_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: funding-carry-${{ matrix.symbol }}
          path: runtime/funding-carry-r1/${{ matrix.symbol }}.json
          retention-days: 14

  aggregate:
    needs: symbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: funding-carry-*
          path: runtime/funding-carry-r1-input
          merge-multiple: true
      - name: Aggregate funding carry R1
        env:
          FC_INPUT_DIR: runtime/funding-carry-r1-input
          FC_SUMMARY_DIR: runtime/funding-carry-r1-summary
        run: node scripts/aggregate_funding_carry_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: funding-carry-r1-summary
          path: runtime/funding-carry-r1-summary/**
          retention-days: 30
