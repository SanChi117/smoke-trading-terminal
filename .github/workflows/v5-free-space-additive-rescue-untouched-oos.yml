name: v5-free-space-additive-rescue-untouched-oos

on:
  pull_request:
    paths:
      - '.github/workflows/v5-free-space-additive-rescue-untouched-oos.yml'
      - 'scripts/apply-free-space-additive-rescue-r20d1.py'
      - 'scripts/aggregate-free-space-additive-rescue-oos.mjs'

jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        window:
          - { key: oos-2024-12, end: '2024-12-31T23:55:00.000Z' }
          - { key: oos-2025-02, end: '2025-02-28T23:55:00.000Z' }
          - { key: oos-2026-01, end: '2026-01-31T23:55:00.000Z' }
        profile:
          - { key: C }
          - { key: R20D1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Apply frozen R20D1 research patch
        if: matrix.profile.key == 'R20D1'
        run: python scripts/apply-free-space-additive-rescue-r20d1.py
      - name: Run fixed 60-day untouched OOS on 19 symbols
        env:
          AUDIT_SYMBOLS: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,SUIUSDT,APTUSDT,NEARUSDT,LINKUSDT,AAVEUSDT,ARBUSDT,OPUSDT,DOGEUSDT,TAOUSDT,ONDOUSDT,INJUSDT,SEIUSDT'
          AUDIT_DAYS: '60'
          AUDIT_END_ISO: '${{ matrix.window.end }}'
        run: node --experimental-strip-types scripts/run_fixed_level_audit.mjs
      - name: Annotate raw audit
        env:
          WINDOW_KEY: '${{ matrix.window.key }}'
          PROFILE: '${{ matrix.profile.key }}'
          END_ISO: '${{ matrix.window.end }}'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('runtime/level-flow-logic-audit/logic-audit.json')
          d=json.loads(p.read_text())
          d['researchConfig']={'window':os.environ['WINDOW_KEY'],'profile':os.environ['PROFILE'],'endIso':os.environ['END_ISO']}
          out=f"r20d1-oos-{os.environ['WINDOW_KEY']}-{os.environ['PROFILE']}.json"
          Path(out).write_text(json.dumps(d,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r20d1-oos-${{ matrix.window.key }}-${{ matrix.profile.key }}
          path: r20d1-oos-${{ matrix.window.key }}-${{ matrix.profile.key }}.json
          if-no-files-found: error

  aggregate:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r20d1-oos-*
          path: r20d1-oos-results
          merge-multiple: true
      - name: Aggregate untouched OOS
        run: node scripts/aggregate-free-space-additive-rescue-oos.mjs r20d1-oos-results r20d1-untouched-oos-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: r20d1-untouched-oos-summary
          path: r20d1-untouched-oos-summary.json
          if-no-files-found: error
