name: multispeed-voltarget-replication-r1

on:
  pull_request:
    paths:
      - '.github/workflows/multispeed-voltarget-replication-r1.yml'
      - 'scripts/run_multispeed_voltarget_replication_r1.mjs'
      - 'scripts/aggregate_multispeed_voltarget_replication_r1.mjs'
      - 'docs/MULTISPEED_VOLTARGET_REPLICATION_R1.md'
  workflow_dispatch:

concurrency:
  group: multispeed-voltarget-replication-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify frozen protocol
        run: test "$(git rev-parse HEAD:docs/MULTISPEED_VOLTARGET_REPLICATION_R1.md)" = "c45062de576c263b1e7dfc363815b0995b135bc9"
      - name: Syntax checks
        run: |
          node --check scripts/run_multispeed_voltarget_replication_r1.mjs
          node --check scripts/aggregate_multispeed_voltarget_replication_r1.mjs

  symbol:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol:
          - BTCUSDT
          - ETHUSDT
          - BNBUSDT
          - XRPUSDT
          - ADAUSDT
          - SOLUSDT
          - DOGEUSDT
          - LINKUSDT
          - AVAXUSDT
          - DOTUSDT
          - LTCUSDT
          - ATOMUSDT
          - AAVEUSDT
          - NEARUSDT
          - INJUSDT
          - OPUSDT
          - ARBUSDT
          - APTUSDT
          - SUIUSDT
          - SEIUSDT
          - TAOUSDT
          - ONDOUSDT
          - TONUSDT
          - FETUSDT
          - WIFUSDT
          - BCHUSDT
          - TRXUSDT
          - XLMUSDT
          - ETCUSDT
          - FILUSDT
          - UNIUSDT
          - ICPUSDT
          - ALGOUSDT
          - VETUSDT
          - RUNEUSDT
          - GALAUSDT
          - SANDUSDT
          - MANAUSDT
          - CRVUSDT
          - CHZUSDT
          - LDOUSDT
          - DYDXUSDT
          - IMXUSDT
          - STXUSDT
          - COMPUSDT
          - SNXUSDT
          - ZECUSDT
          - KAVAUSDT
          - XTZUSDT
          - ENJUSDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Run frozen multi-speed architecture
        env:
          MSV_SYMBOL: '${{ matrix.symbol }}'
        run: node scripts/run_multispeed_voltarget_replication_r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multispeed-${{ matrix.symbol }}
          path: runtime/multispeed-voltarget-replication-r1/${{ matrix.symbol }}.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: symbol
    if: always() && needs.symbol.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: multispeed-*
          path: multispeed-results
          merge-multiple: true
      - name: Aggregate architecture replication
        run: node scripts/aggregate_multispeed_voltarget_replication_r1.mjs multispeed-results multispeed-voltarget-replication-r1-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: multispeed-voltarget-replication-r1-summary
          path: |
            multispeed-voltarget-replication-r1-summary.json
            multispeed-voltarget-replication-r1-summary.md
          if-no-files-found: error
          retention-days: 90
