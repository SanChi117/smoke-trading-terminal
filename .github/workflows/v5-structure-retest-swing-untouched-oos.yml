name: v5-structure-retest-swing-untouched-oos

on:
  pull_request:
    paths:
      - '.github/workflows/v5-structure-retest-swing-untouched-oos.yml'
      - 'scripts/apply-structure-retest-swing-selector.py'
      - 'scripts/aggregate-structure-retest-swing-untouched-oos.mjs'

jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { key: oos-early-C, window: oos-early, profile: C, end: '2025-03-31T23:55:00.000Z' }
          - { key: oos-early-S, window: oos-early, profile: S, end: '2025-03-31T23:55:00.000Z' }
          - { key: oos-gap-a-C, window: oos-gap-a, profile: C, end: '2026-01-31T23:55:00.000Z' }
          - { key: oos-gap-a-S, window: oos-gap-a, profile: S, end: '2026-01-31T23:55:00.000Z' }
          - { key: oos-gap-b-C, window: oos-gap-b, profile: C, end: '2026-05-31T23:55:00.000Z' }
          - { key: oos-gap-b-S, window: oos-gap-b, profile: S, end: '2026-05-31T23:55:00.000Z' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci

      - name: Apply frozen candidate S inside runner only
        if: matrix.profile == 'S'
        run: python scripts/apply-structure-retest-swing-selector.py

      - name: Run untouched fixed 60-day exact audit on 19 symbols
        env:
          AUDIT_SYMBOLS: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,SUIUSDT,APTUSDT,NEARUSDT,LINKUSDT,AAVEUSDT,ARBUSDT,OPUSDT,DOGEUSDT,TAOUSDT,ONDOUSDT,INJUSDT,SEIUSDT'
          AUDIT_DAYS: '60'
          AUDIT_END_ISO: '${{ matrix.end }}'
        run: node --experimental-strip-types scripts/run_fixed_level_audit.mjs

      - name: Annotate untouched OOS audit
        env:
          KEY: '${{ matrix.key }}'
          WINDOW: '${{ matrix.window }}'
          PROFILE: '${{ matrix.profile }}'
          END_ISO: '${{ matrix.end }}'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('runtime/level-flow-logic-audit/logic-audit.json')
          d=json.loads(p.read_text())
          d['researchConfig']={'key':os.environ['KEY'],'window':os.environ['WINDOW'],'profile':os.environ['PROFILE'],'endIso':os.environ['END_ISO'],'untouchedOos':True}
          Path(f"structure-retest-swing-oos-{os.environ['KEY']}.json").write_text(json.dumps(d,separators=(',',':')))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: structure-retest-swing-oos-${{ matrix.key }}
          path: structure-retest-swing-oos-${{ matrix.key }}.json
          if-no-files-found: error

  aggregate:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: structure-retest-swing-oos-*
          path: structure-retest-swing-oos-results
          merge-multiple: true
      - name: Aggregate untouched OOS C vs S
        run: node scripts/aggregate-structure-retest-swing-untouched-oos.mjs structure-retest-swing-oos-results structure-retest-swing-untouched-oos-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: structure-retest-swing-untouched-oos-summary
          path: structure-retest-swing-untouched-oos-summary.json
          if-no-files-found: error
