name: experiment-15m-confirm-015

on:
  pull_request:
    paths:
      - '.github/workflows/experiment-15m-confirm-015.yml'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - name: Apply isolated candidate threshold
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/lib/level/analysis-v3.ts')
          s = p.read_text()
          old = 'body >= atr * 0.2;'
          new = 'body >= atr * 0.15;'
          assert s.count(old) == 1, f'expected one threshold, found {s.count(old)}'
          p.write_text(s.replace(old, new))
          print('CANDIDATE 15m confirmation body: 0.20 ATR -> 0.15 ATR')
          PY
      - name: Fetch official Binance UM futures history
        run: python scripts/fetch-binance-data-vision.py
      - name: Run candidate 19-symbol 30-day backtest
        run: node --experimental-strip-types scripts/portfolio-30d-backtest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-15m-confirm-015
          path: portfolio-30d-backtest.json
          if-no-files-found: error
