name: donchian-long-only-crossasset-oos-r1

on:
  pull_request:
    paths:
      - '.github/workflows/donchian-long-only-crossasset-oos-r1.yml'
      - 'scripts/run_donchian_long_only_crossasset_oos_r1.mjs'
      - 'scripts/aggregate_donchian_long_only_crossasset_oos_r1.mjs'
      - 'docs/DONCHIAN_LONG_ONLY_CROSSASSET_OOS_R1.md'
  workflow_dispatch:

concurrency:
  group: donchian-long-only-crossasset-oos-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify frozen protocol
        run: test "$(git rev-parse HEAD:docs/DONCHIAN_LONG_ONLY_CROSSASSET_OOS_R1.md)" = "417ebbae23adac55455de990028172b57fd77eeb"
      - name: Syntax checks
        run: |
          node --check scripts/run_donchian_long_only_crossasset_oos_r1.mjs
          node --check scripts/aggregate_donchian_long_only_crossasset_oos_r1.mjs

  symbol:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        symbol:
          - BCHUSDT
          - TRXUSDT
          - XLMUSDT
          - ETCUSDT
          - FILUSDT
          - UNIUSDT
          - ICPUSDT
          - ALGOUSDT
          - VETUSDT
          - RUNEUSDT
          - GALAUSDT
          - SANDUSDT
          - MANAUSDT
          - CRVUSDT
          - CHZUSDT
          - LDOUSDT
          - DYDXUSDT
          - IMXUSDT
          - STXUSDT
          - COMPUSDT
          - SNXUSDT
          - ZECUSDT
          - KAVAUSDT
          - XTZUSDT
          - ENJUSDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Run frozen untouched-asset long-only test
        env:
          DLO_SYMBOL: '${{ matrix.symbol }}'
        run: node scripts/run_donchian_long_only_crossasset_oos_r1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: donchian-long-crossasset-${{ matrix.symbol }}
          path: runtime/donchian-long-only-crossasset-oos-r1/${{ matrix.symbol }}.*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: symbol
    if: always() && needs.symbol.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: donchian-long-crossasset-*
          path: donchian-long-crossasset-results
          merge-multiple: true
      - name: Aggregate untouched cross-asset OOS gate
        run: node scripts/aggregate_donchian_long_only_crossasset_oos_r1.mjs donchian-long-crossasset-results donchian-long-only-crossasset-oos-r1-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: donchian-long-only-crossasset-oos-r1-summary
          path: |
            donchian-long-only-crossasset-oos-r1-summary.json
            donchian-long-only-crossasset-oos-r1-summary.md
          if-no-files-found: error
          retention-days: 90
