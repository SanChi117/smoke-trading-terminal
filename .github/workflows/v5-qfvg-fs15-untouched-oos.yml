name: v5-qfvg-fs15-untouched-oos
on:
  pull_request:
    paths:
      - '.github/workflows/v5-qfvg-fs15-untouched-oos.yml'
      - 'scripts/apply-qfvg-fs15-untouched-oos.py'
      - 'scripts/aggregate-qfvg-fs15-untouched-oos.mjs'
jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        window:
          - { key: oos-2024-12-31, end: '2024-12-31T23:55:00.000Z' }
          - { key: oos-2025-03-31, end: '2025-03-31T23:55:00.000Z' }
          - { key: oos-2026-01-31, end: '2026-01-31T23:55:00.000Z' }
        profile: [C, QFVG_FS15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Apply frozen QFVG_FS15 research profile
        if: matrix.profile == 'QFVG_FS15'
        env: { V5_QUALITY_PROFILE: 'QFVG_FS15' }
        run: python scripts/apply-qfvg-fs15-untouched-oos.py
      - name: Run fixed untouched 60-day replay
        env:
          AUDIT_SYMBOLS: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,SUIUSDT,APTUSDT,NEARUSDT,LINKUSDT,AAVEUSDT,ARBUSDT,OPUSDT,DOGEUSDT,TAOUSDT,ONDOUSDT,INJUSDT,SEIUSDT'
          AUDIT_DAYS: '60'
          AUDIT_END_ISO: '${{ matrix.window.end }}'
          V5_QUALITY_PROFILE: '${{ matrix.profile }}'
        run: node --experimental-strip-types scripts/run_fixed_level_audit.mjs || test -f runtime/level-flow-logic-audit/logic-audit.json
      - name: Annotate untouched OOS result
        env:
          WINDOW: '${{ matrix.window.key }}'
          PROFILE: '${{ matrix.profile }}'
          END_ISO: '${{ matrix.window.end }}'
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('runtime/level-flow-logic-audit/logic-audit.json').read_text())
          d['researchConfig']={'window':os.environ['WINDOW'],'role':'untouched-oos','profile':os.environ['PROFILE'],'endIso':os.environ['END_ISO'],'days':60,'untouchedOos':True}
          Path(f"qfvg-oos-{os.environ['WINDOW']}-{os.environ['PROFILE']}.json").write_text(json.dumps(d,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qfvg-oos-${{ matrix.window.key }}-${{ matrix.profile }}
          path: qfvg-oos-${{ matrix.window.key }}-${{ matrix.profile }}.json
          if-no-files-found: error
  aggregate:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'qfvg-oos-*', path: qfvg-oos-results, merge-multiple: true }
      - run: node scripts/aggregate-qfvg-fs15-untouched-oos.mjs qfvg-oos-results qfvg-fs15-untouched-oos-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: qfvg-fs15-untouched-oos-summary
          path: qfvg-fs15-untouched-oos-summary.json
          if-no-files-found: error
