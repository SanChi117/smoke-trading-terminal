name: level-flow-sample-4x60

on:
  pull_request:
    branches: [main]
    paths:
      - "app/lib/level/**"
      - "scripts/run_level_flow_logic_audit.mjs"
      - ".github/workflows/level-flow-sample-4x60.yml"
  workflow_dispatch:

concurrency:
  group: level-flow-sample-4x60-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Install
        run: npm ci
      - name: Strategy invariant tests
        run: node --experimental-strip-types --test tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Logic lint
        run: npx eslint app/lib/level scripts/run_level_flow_logic_audit.mjs tests/mtf-level-strategy.test.mjs tests/binance-level-client.test.mjs
      - name: Production build
        run: npm run build
      - name: BTC ETH SOL BNB 60-day logic audit
        env:
          AUDIT_SYMBOLS: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT
          AUDIT_DAYS: 60
        run: node --experimental-strip-types scripts/run_level_flow_logic_audit.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: smoke-level-flow-sample-4x60
          path: runtime/level-flow-logic-audit/
          if-no-files-found: error
          retention-days: 30
