name: cloud-backup-route-contract-qa

on:
  push:
    paths:
      - scripts/cloud_backup_route_contract_qa.mjs
      - docs/reference/appdeploy-v47-browser-paper-backups.ts.txt
      - .github/workflows/cloud-backup-route-contract-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-isolation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install exact project dependencies
        run: npm ci
      - name: Exercise frozen deployed backup route with two simulated identities
        run: node --experimental-strip-types scripts/cloud_backup_route_contract_qa.mjs
