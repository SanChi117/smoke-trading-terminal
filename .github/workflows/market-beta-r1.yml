name: market-beta-r1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/MARKET_BETA_R1.md'
      - 'scripts/run_market_beta_symbol_r1.mjs'
      - 'scripts/aggregate_market_beta_r1.mjs'
      - '.github/workflows/market-beta-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: sha256sum docs/MARKET_BETA_R1.md
      - run: |
          node --check scripts/run_market_beta_symbol_r1.mjs
          node --check scripts/aggregate_market_beta_r1.mjs
  symbol:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,ADAUSDT,SOLUSDT,DOGEUSDT,LINKUSDT,AVAXUSDT,DOTUSDT,LTCUSDT,ATOMUSDT,AAVEUSDT,NEARUSDT,INJUSDT,OPUSDT,ARBUSDT,APTUSDT,SUIUSDT,SEIUSDT,TAOUSDT,ONDOUSDT,TONUSDT,FETUSDT,WIFUSDT,BCHUSDT,TRXUSDT,XLMUSDT,ETCUSDT,FILUSDT,UNIUSDT,ICPUSDT,ALGOUSDT,VETUSDT,RUNEUSDT,GALAUSDT,SANDUSDT,MANAUSDT,CRVUSDT,CHZUSDT,LDOUSDT,DYDXUSDT,IMXUSDT,STXUSDT,COMPUSDT,SNXUSDT,ZECUSDT,KAVAUSDT,XTZUSDT,ENJUSDT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - run: sudo apt-get update -qq && sudo apt-get install -y unzip
      - env:
          MB_SYMBOL: ${{ matrix.symbol }}
          MB_OUTPUT_DIR: runtime/market-beta-r1
        run: node scripts/run_market_beta_symbol_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mb-${{ matrix.symbol }}
          path: runtime/market-beta-r1/${{ matrix.symbol }}.json
          retention-days: 14
  aggregate:
    needs: symbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '${{ env.NODE_VERSION }}'}
      - uses: actions/download-artifact@v4
        with:
          pattern: mb-*
          path: runtime/market-beta-r1-input
          merge-multiple: true
      - env:
          MB_INPUT_DIR: runtime/market-beta-r1-input
          MB_SUMMARY_DIR: runtime/market-beta-r1-summary
        run: node scripts/aggregate_market_beta_r1.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: market-beta-r1-summary
          path: runtime/market-beta-r1-summary/**
          retention-days: 30
