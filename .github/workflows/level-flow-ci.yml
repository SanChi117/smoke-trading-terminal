name: level-flow-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "app/components/**"
      - "app/lib/level/**"
      - "app/lib/mtf-level-strategy.ts"
      - "app/lib/binance-level-client.ts"
      - "app/page.tsx"
      - "tests/**"
      - "scripts/validate_terminal_safety.py"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/level-flow-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/components/**"
      - "app/lib/level/**"
      - "app/lib/mtf-level-strategy.ts"
      - "app/lib/binance-level-client.ts"
      - "app/page.tsx"
      - "tests/**"
      - "scripts/validate_terminal_safety.py"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/level-flow-ci.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm run test:python
