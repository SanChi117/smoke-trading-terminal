name: v5-from-reaction-quality-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/v5-from-reaction-quality-diagnostic.yml'
      - 'scripts/apply-from-reaction-quality-diagnostic.py'
      - 'scripts/aggregate-from-reaction-quality-diagnostic.mjs'

jobs:
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { key: quality-a, end: '2025-11-30T23:55:00.000Z' }
          - { key: quality-b, end: '2026-07-31T23:55:00.000Z' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Ensure archive tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Apply PAPER-only FROM/reaction diagnostic instrumentation
        run: python scripts/apply-from-reaction-quality-diagnostic.py
      - name: Run fixed 180-day diagnostic on 19 symbols
        env:
          AUDIT_SYMBOLS: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,SUIUSDT,APTUSDT,NEARUSDT,LINKUSDT,AAVEUSDT,ARBUSDT,OPUSDT,DOGEUSDT,TAOUSDT,ONDOUSDT,INJUSDT,SEIUSDT'
          AUDIT_DAYS: '180'
          AUDIT_END_ISO: '${{ matrix.end }}'
        run: node --experimental-strip-types scripts/run_fixed_level_audit.mjs
      - name: Annotate diagnostic result
        env:
          WINDOW_KEY: '${{ matrix.key }}'
          END_ISO: '${{ matrix.end }}'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('runtime/level-flow-logic-audit/logic-audit.json')
          d=json.loads(p.read_text())
          d['researchConfig']={'key':os.environ['WINDOW_KEY'],'endIso':os.environ['END_ISO']}
          out=f"from-reaction-quality-{os.environ['WINDOW_KEY']}.json"
          Path(out).write_text(json.dumps(d,separators=(',',':')))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: from-reaction-quality-${{ matrix.key }}
          path: from-reaction-quality-${{ matrix.key }}.json
          if-no-files-found: error

  aggregate:
    needs: window
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: from-reaction-quality-*
          path: from-reaction-quality-results
          merge-multiple: true
      - name: Aggregate quality diagnostic
        run: node scripts/aggregate-from-reaction-quality-diagnostic.mjs from-reaction-quality-results from-reaction-quality-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: from-reaction-quality-summary
          path: from-reaction-quality-summary.json
          if-no-files-found: error
